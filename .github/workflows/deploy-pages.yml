name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # The real-model test is skipped automatically: the model is not in the repo.
      - run: npm test

      - run: npm run lint

      - name: Build static site
        run: npm run build
        env:
          # e.g. "/web-annotator", derived from the repository so renames/moves keep working
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # GitHub Pages cannot send COOP/COEP headers; a service worker adds them instead
          NEXT_PUBLIC_COI_SERVICE_WORKER: "1"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
